  <style>
    /* =========================
       CATEGORIAS
    ========================== */
    .galeria-categorias {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .galeria-categoria.active div {
      background-color: var(--accent-color);
      color: white;
    }

    .galeria-categoria {
      flex: 1 1 220px;
      text-decoration: none;
    }

    .galeria-categoria .card {
      text-align: center;
      padding: 1.25rem;
      transition: 0.3s;
    }

    .galeria-categoria:hover .card {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    /* =========================
       GALERIA
    ========================== */

    /* Section apenas dá respiro */
    .galeria-section {
      padding: 1.5rem;
    }

    /* Wrapper centralizado */
    .galeria-flex {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: flex-start;

      max-width: 1200px;
      margin: 0 auto;
      /* 👈 centro real */
    }

    /* Item */
    .galeria-item {
      flex: 0 0 calc(25% - 1rem);
      aspect-ratio: 4 / 3;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    .galeria-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .galeria-item:hover img {
      transform: scale(1.05);
    }

    /* Breakpoints */
    @media (max-width: 1200px) {
      .galeria-item {
        flex: 0 0 calc(33.333% - 1rem);
      }
    }

    @media (max-width: 768px) {
      .galeria-item {
        flex: 0 0 calc(50% - 1rem);
      }
    }

    @media (max-width: 480px) {
      .galeria-item {
        flex: 0 0 100%;
      }
    }
  </style>
</head>

  <script>
    /* =========================
       CATEGORIAS
    ========================== */
    document.querySelectorAll('.galeria-categoria').forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();

        document.querySelectorAll('.galeria-categoria')
          .forEach(el => el.classList.remove('active'));

        link.classList.add('active');

        document.querySelectorAll('.galeria-section')
          .forEach(sec => sec.classList.add('d-none'));

        document.getElementById(link.dataset.target)
          .classList.remove('d-none');
      });
    });

    /* =========================
       GALERIA DINÂMICA
    ========================== */
    const galerias = {
      mobilizacao: 40,
      formacao: 34,
      agentes: 23,
      concurso: 23
    };

    function criarGaleria(categoria, total) {
      const section = document.getElementById(categoria);

      const wrapper = document.createElement('div');
      wrapper.className = 'galeria-flex';

      for (let i = 1; i <= total; i++) {
        const a = document.createElement('a');
        a.href = `assets/img/galeria/${categoria}/${i}.jpg`;
        a.className = 'galeria-item glightbox';
        a.dataset.gallery = categoria;

        a.innerHTML = `
        <img src="assets/img/galeria/${categoria}/thumbs/${i}.jpg"
             loading="lazy"
             alt="${categoria} ${i}">
      `;

        wrapper.appendChild(a);
      }

      section.appendChild(wrapper);
    }

    Object.entries(galerias).forEach(([cat, total]) => {
      criarGaleria(cat, total);
    });

    GLightbox({ selector: '.glightbox' });
  </script>
